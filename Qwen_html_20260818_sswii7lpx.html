<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reel Interest Inference Agent</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <header>
        <h1>Reel Interest Inference Agent</h1>
        <p>Paste a student's watch history to infer latent career signals.</p>
    </header>

    <main class="container">
        <section class="card input-section">
            <label for="historyInput">Watch History Sequence</label>
            <textarea id="historyInput" placeholder="e.g., [Java meme] -> [SWE day-in-the-life] -> [MacBook vs Dell]"></textarea>
            <button id="analyzeBtn" class="btn">Analyze & Recommend</button>
        </section>

        <section class="card results-section" id="resultsSection">
            <h2>Inference Results</h2>
            <div class="results-grid" id="resultsGrid"></div>
        </section>
    </main>

    <script src="/static/script.js"></script>
</body>
</html>
